name: Release Pipeline

on:
  push:
    branches:
      - main

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          echo "Running validation tests..."
          npm install --prefix app
          npm test --prefix app
          

deploy-production:
  runs-on: ubuntu-latest
  needs: validate-release
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
         
    - name: deploy to production
      run: |
        chmod +x scripts/deploy.sh
        ./scripts/deploy.sh
        
    
  
  
